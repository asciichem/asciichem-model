name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match lib/asciichem_model/version.rb)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): register this gem's trusted publisher on
    # https://rubygems.org as repository asciichem/asciichem-model +
    # workflow release.yml, with no environment (matching this job).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify version matches input
        run: |
          actual=$(ruby -e 'require "./lib/asciichem_model/version"; print AsciiChemModel::VERSION')
          if [ "$actual" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: input=${{ inputs.version }}, lib/asciichem_model/version.rb=$actual"
            exit 1
          fi
          echo "Releasing $actual"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Builds and pushes using the GitHub OIDC identity — no API keys.
      - uses: rubygems/release-gem@v1
      - name: Summary
        run: |
          echo "Released asciichem-model ${{ inputs.version }} to RubyGems"
          echo "https://rubygems.org/gems/asciichem-model"
