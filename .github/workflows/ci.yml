name: contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Generated types are current
        run: |
          cp -r schemas/v1/types /tmp/types-before
          bundle exec scripts/generate-types-from-schemas
          diff -r /tmp/types-before schemas/v1/types
      - run: bundle exec scripts/validate-examples
